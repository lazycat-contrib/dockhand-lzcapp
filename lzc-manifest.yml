application:
  subdomain: dockhand
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://dockhand-service:3000/

services:
  dockhand-service:
    # fnsys/dockhand:latest
    image: registry.lazycat.cloud/czyt/fnsys/dockhand:a90e8588eacc56d7
    binds:
      - /lzcapp/var/data:/app/data
    cpu_shares: 512
    mem_limit: 512M
