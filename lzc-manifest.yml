name: Dockhand
package: community.lazycat.app.dockhand
version: 1.0.6
min_os_version: 1.3.8
description: "Docker management tool with a friendly web interface"
license: MIT
homepage: https://github.com/fnsys/dockhand
author: fnsys

application:
  subdomain: dockhand
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://dockhand-service:3000/

services:
  dockhand-service:
    # fnsys/dockhand:latest
    image: registry.lazycat.cloud/czyt/fnsys/dockhand:a90e8588eacc56d7
    binds:
      - /lzcapp/var/data:/app/data
    cpu_shares: 512
    mem_limit: 512M
    restart: unless-stopped

unsupported_platforms:
  - ios
  - android
  - tvos

locales:
  en:
    name: "Dockhand"
    description: "Docker management tool with a friendly web interface"
  zh:
    name: "Dockhand"
    description: "一个友好的 Docker 管理工具，提供简洁的 Web 界面"
